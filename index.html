<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal Cat</title>

<style>

body{
    margin:0;
    background:black;
    overflow:hidden;
    font-family:monospace;
    color:#00ff66;
}

#terminal{
    position:absolute;
    left:0;
    top:0;
    width:50%;
    height:100%;
    padding:20px;
    box-sizing:border-box;
    overflow:hidden;
    font-size:16px;
    line-height:1.4;
}

#catZone{
    position:absolute;
    right:0;
    top:0;
    width:50%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

#cat{
    width:700px;
    max-width:95%;
    image-rendering:auto;
    filter:
    drop-shadow(0 0 20px #00ff66)
    drop-shadow(0 0 40px #00ff66);
}

#warning{
    margin-top:20px;
    color:red;
    font-size:42px;
    font-weight:bold;
    text-shadow:
    0 0 10px red,
    0 0 30px red,
    0 0 50px red;
    animation:pulse 1s infinite;
}

.line{
    animation:flicker .1s infinite;
}

@keyframes pulse{
    0%{opacity:1;}
    50%{opacity:.3;}
    100%{opacity:1;}
}

@keyframes flicker{
    0%{opacity:1;}
    50%{opacity:.8;}
    100%{opacity:1;}
}

</style>
</head>
<body>

<div id="terminal"></div>

<div id="catZone">

<img id="cat" src="frame1.png">

<div id="warning">
You ∆®€ #∆Cked
</div>

</div>

<script>

const terminal = document.getElementById("terminal");

const logs = [

"ACCESSING DEVICE STORAGE...",
"READING SECURE CACHE...",
"EXTRACTING SAVED TOKENS...",
"CONNECTING TO MEMORY BLOCK...",
"SYNCING LOCAL DATABASE...",
"DOWNLOADING PRIVATE DATA...",
"UNLOCKING DEVICE STRUCTURE...",
"READING APPLICATION FILES...",
"EXPORTING ARCHIVE...",
"SCANNING USER DIRECTORY...",
"LINKING SESSION TOKENS...",
"FETCHING SAVED PASSWORDS...",
"READING CLOUD STORAGE...",
"COLLECTING DEVICE INFO...",
"OPENING ENCRYPTED DATA...",
"SEARCHING FOR MEDIA FILES...",
"ANALYZING DEVICE MEMORY...",
"READING PRIVATE STORAGE...",
"ACCESSING LOCAL SESSIONS...",
"DOWNLOADING FILE PACKAGE..."

];

function addLine(){

    const div = document.createElement("div");

    div.className = "line";

    div.textContent =
    logs[Math.floor(Math.random()*logs.length)]
    +
    " ["
    +
    Math.floor(Math.random()*999999999)
    +
    "]";

    terminal.appendChild(div);

    if(terminal.children.length > 120){

        terminal.removeChild(
        terminal.children[0]
        );

    }

    terminal.scrollTop =
    terminal.scrollHeight;

}

setInterval(addLine,40);

const frames = [

"frame1.png",
"frame2.png",
"frame3.png"

];

let current = 0;

setInterval(()=>{

    current++;

    if(current >= frames.length){

        current = 0;

    }

    document.getElementById("cat").src =
    frames[current];

},180);

</script>
</body>
</html>
